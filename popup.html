<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <style>
        body { width: 240px; background: #1a1a1a; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; }
        [hidden] { display: none !important; }
        h3 { color: #4ade80; margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .versao { font-size: 10px; color: #777; font-weight: normal; }
        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 4px; }
        input { width: 100%; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 6px; box-sizing: border-box; margin-bottom: 8px; font-size: 12px; }
        input.codigo { font-size: 18px; letter-spacing: 6px; text-align: center; }
        input.maiusculo { text-transform: uppercase; }
        button { width: 100%; background: #3b82f6; color: #fff; border: none; padding: 7px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
        button:hover:not(:disabled) { background: #2563eb; }
        button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
        button.link { background: none; color: #93c5fd; font-weight: normal; font-size: 11px; padding: 2px; text-decoration: underline; }
        button.link:hover:not(:disabled) { background: none; color: #bfdbfe; }
        #btn-comprar { background: #10b981; }
        #btn-comprar:hover:not(:disabled) { background: #059669; }
        #btn-historico { background: #4b5563; }
        #btn-historico:hover:not(:disabled) { background: #374151; }
        .dica { font-size: 11px; color: #bbb; margin: 0 0 8px; }
        .conta-email { font-size: 12px; color: #ddd; margin-bottom: 8px; word-break: break-all; }
        .indicacao { background: #111; border: 1px solid #333; border-radius: 6px; padding: 8px; margin: 4px 0 6px; font-size: 11px; color: #bbb; }
        .indicacao .linha { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 4px 0; }
        .indicacao strong { font-size: 15px; color: #fbbf24; letter-spacing: 2px; }
        .indicacao button { width: auto; margin: 0; padding: 3px 8px; font-size: 11px; background: #374151; }
        .status { font-size: 11px; margin-top: 6px; text-align: center; color: #888; }
        .status.ok { color: #22c55e; }
        .status.erro { color: #ef4444; }
        .status.aviso { color: #eab308; }
        .vencimento-info { font-size: 11px; margin-top: 4px; text-align: center; color: #bbb; }
    </style>
</head>
<body>
    <h3>Pokeidle Bot <span id="lbl-versao" class="versao"></span></h3>

    <!-- Tela 1: entrar com e-mail + código -->
    <section id="tela-login" hidden>
        <label for="input-email">E-mail:</label>
        <input type="email" id="input-email" placeholder="seu@email.com" autocomplete="email">

        <div id="bloco-pedir">
            <label for="input-indicacao">Código de indicação (opcional):</label>
            <input type="text" id="input-indicacao" class="maiusculo" placeholder="EX: AB12CD" maxlength="12" autocomplete="off">
            <button id="btn-enviar-codigo">Enviar código por e-mail</button>
        </div>

        <div id="bloco-codigo" hidden>
            <p class="dica" id="lbl-dica-codigo">Enviamos um código de 6 dígitos para o seu e-mail.</p>
            <label for="input-codigo">Código recebido:</label>
            <input type="text" id="input-codigo" class="codigo" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
            <button id="btn-verificar">Confirmar</button>
            <button id="btn-reenviar" class="link">Reenviar código</button>
            <button id="btn-trocar-email" class="link">Usar outro e-mail</button>
        </div>
    </section>

    <!-- Tela 2: conta verificada -->
    <section id="tela-conta" hidden>
        <div class="conta-email" id="lbl-email"></div>
        <button id="btn-comprar">Comprar / Renovar Licença</button>
        <button id="btn-historico">Ver Histórico de Compras</button>

        <div class="indicacao">
            Seu código de indicação:
            <div class="linha">
                <strong id="lbl-indicacao">------</strong>
                <button id="btn-copiar">Copiar</button>
            </div>
            Quando um amigo usar seu código e fizer a 1ª compra, vocês dois ganham +1 dia.
            <div id="lbl-indicacoes" hidden></div>
        </div>

        <button id="btn-sair" class="link">Sair / trocar e-mail</button>
    </section>

    <div id="status" class="status">Status: Desconectado</div>
    <div id="vencimento" class="vencimento-info">Validade: --/--/----</div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="popup.js"></script>
</body>
</html>
